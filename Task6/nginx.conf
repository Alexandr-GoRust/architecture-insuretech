# Task6 — Rate Limiting через Nginx
# Задача: ограничить количество запросов — не более 10 запросов в минуту,
# при превышении клиент получает HTTP 429 (Too Many Requests).
#
# Как это работает:
#   limit_req_zone — описывает зону разделяемой памяти, где Nginx хранит
#     состояние запросов по ключу $binary_remote_addr (IP-адрес клиента,
#     двоичное представление — компактнее строкового). Размер 10m хватает
#     примерно на 160 000 IP-адресов. rate=10r/m — 10 запросов в минуту.
#   limit_req_status 429 — код ответа при превышении лимита
#     (по умолчанию Nginx вернул бы 503).
#   limit_req zone=perip — включает ограничение для конкретного location.
#     Параметр burst не задан: запросы сверх нормы отклоняются сразу,
#     без очереди ожидания (жёсткий лимит, как требует задание).

http {

    # Зона хранения счётчиков: ключ — IP клиента, лимит 10 запросов/мин
    limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/m;

    # Код ошибки при превышении лимита
    limit_req_status 429;

    # Настройка upstream для балансировки нагрузки
    upstream backend_servers {
        server backend1.example.com;
        server backend2.example.com;
        server backend3.example.com;
    }

    server {
        listen 80;

        location / {
            limit_req zone=perip;          # применяем лимит 10 r/m на IP
            proxy_pass http://backend_servers;
        }
    }
}
